services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-vocalis}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - vocalis_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vocalis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocalis_pgdata:
